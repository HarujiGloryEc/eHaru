spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: haru-shop-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/haru_shop}
    username: ${DB_USER:haru}
    password: ${DB_PASS:haru}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
